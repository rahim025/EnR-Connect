name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Construire la partie web
        run: npm run build

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          npx cap sync android

      - name: Utiliser la clé de signature fixe
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EnR-Connect.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EnR Connect v${{ github.run_number }}
          files: EnR-Connect.apk
