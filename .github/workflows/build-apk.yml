name: Construire l'APK

# L'APK n'est reconstruit que pour les changements natifs (notifications, icône, signature…).
# Les changements de l'interface passent par le site (site.yml) et arrivent tout seuls dans l'appli.
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'assets/**'
      - 'keystore/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Construire la partie web
        run: npm run build
        env:
          VITE_BUILD: ${{ github.run_number }}

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          # Notifications, bulle Messenger et réponse rapide (code natif du dossier native/)
          mkdir -p android/app/src/main/java/com/enrconnect/app android/app/src/main/res/drawable
          cp native/java/*.java android/app/src/main/java/com/enrconnect/app/
          # Petite icône de notification (créée ici, aucun fichier à envoyer)
          cat > android/app/src/main/res/drawable/ic_stat.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,7a5,5 0 1,0 0.001,0z" />
              <path
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="2"
                  android:strokeLineCap="round"
                  android:pathData="M12,1v3M12,20v3M1,12h3M20,12h3M4.2,4.2l2.1,2.1M17.7,17.7l2.1,2.1M4.2,19.8l2.1,-2.1M17.7,6.3l2.1,-2.1" />
          </vector>
          EOF
          python3 native/patch-manifest.py
          # Corrige « Your device doesn't support credential manager » (connexion Google)
          sed -i "s/ext {/ext {\n    androidxCredentialsVersion = '1.3.0'\n    androidxCredentialsPlayServicesAuthVersion = '1.3.0'/" android/variables.gradle
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.credentials:credentials:1.3.0'
                      force 'androidx.credentials:credentials-play-services-auth:1.3.0'
                  }
              }
          }
          EOF
          tail -12 android/build.gradle
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          npx cap sync android
          # Force la signature avec la clé fixe du dépôt (keystore/debug.keystore)
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../keystore/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF

      - name: Utiliser la clé de signature fixe
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Vérifier la signature et la config Google
        run: |
          grep certificate_hash android/app/google-services.json || echo "AUCUN certificate_hash dans google-services.json"
          echo "SHA1 de keystore/debug.keystore :"
          keytool -list -v -keystore keystore/debug.keystore -storepass android | grep SHA1
          echo "SHA1 de l'APK :"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA1

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EnR-Connect.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EnR Connect v${{ github.run_number }}
          files: EnR-Connect.apk
